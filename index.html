<div class="input-group">
    <label for="kwh">Monatlicher Stromverbrauch (kWh): / مصرف ماهانه</label>
    <input type="number" id="kwh" placeholder="z.B. 400">
    
    <!-- بخش راهنمای سریع مصرف -->
    <div style="margin-top: 10px; font-size: 0.8rem; color: #475569; text-align: left;">
        <b>💡 Verbrauch nicht bekannt? (مصرف خود را نمی‌دانید؟)</b>
        <p style="margin: 4px 0 8px 0; color: #64748b;">Klicken Sie auf Ihre Haushaltsgröße / تعداد افراد خانواده را انتخاب کنید:</p>
        
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button type="button" onclick="setKwh(125)" style="flex:1; padding:6px; font-size:0.75rem; background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; border-radius:6px; margin:0;">
                👤 1 Person<br>(125 kWh)
            </button>
            <button type="button" onclick="setKwh(208)" style="flex:1; padding:6px; font-size:0.75rem; background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; border-radius:6px; margin:0;">
                👥 2 Personen<br>(208 kWh)
            </button>
            <button type="button" onclick="setKwh(291)" style="flex:1; padding:6px; font-size:0.75rem; background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; border-radius:6px; margin:0;">
                👨‍👩‍👧 3 Personen<br>(291 kWh)
            </button>
            <button type="button" onclick="setKwh(400)" style="flex:1; padding:6px; font-size:0.75rem; background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; border-radius:6px; margin:0;">
                👨‍👩‍👧‍👦 4+ Personen<br>(400 kWh)
            </button>
        </div>
    </div>
</div>

<script>
// تابع جاوااسکریپت برای جاگذاری خودکار عدد با کلیک روی دکمه‌ها
function setKwh(val) {
    document.getElementById('kwh').value = val;
}
</script>
