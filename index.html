<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه‌گر آنلاین نیروگاه خورشیدی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0fdf4; text-align: center; padding: 40px 10px; color: #166534; }
        .box { background: white; max-width: 450px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
        button { background: #16a34a; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #15803d; }
        .result { display: none; margin-top: 20px; background: #f0fdf4; padding: 15px; border-radius: 8px; text-align: right; }
    </style>
</head>
<body>

<div class="box">
    <h2>☀️ استارتاپ محاسبه خورشیدی</h2>
    <p>میزان مصرف برق ماهانه خود (کیلووات‌ساعت) را وارد کنید:</p>

    <input type="number" id="kwh" placeholder="مثلاً ۶۰۰">
    <input type="text" id="phone" placeholder="شماره تماس (جهت دریافت مشاوره)">
    <button onclick="calculate()">محاسبه آنلاین سیستم</button>

    <div class="result" id="resultBox">
        <h4>نتیجه برآورد مهندسی:</h4>
        <p>⚡ ظرفیت نیروگاه: <b id="capacity"></b> کیلووات</p>
        <p>🧩 تعداد پنل ۵۵۰ وات: <b id="panels"></b> عدد</p>
        <p>🔌 توان اینورتر: <b id="inverter"></b> کیلووات</p>
    </div>
</div>

<script>
async function calculate() {
    const kwh = document.getElementById('kwh').value;
    const phone = document.getElementById('phone').value;

    if(!kwh) { alert("لطفا میزان مصرف را وارد کنید"); return; }

    const res = await fetch('/calculate', {
        method: 'POST',
        headers: {'Content-Type': 'json'},
        body: JSON.stringify({ monthly_kwh: kwh, phone: phone })
    });

    const data = await res.json();
    if(data.error) { alert(data.error); return; }

    document.getElementById('capacity').innerText = data.recommended_capacity_kw;
    document.getElementById('panels').innerText = data.total_panels_550w;
    document.getElementById('inverter').innerText = data.inverter_size_kw;
    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
